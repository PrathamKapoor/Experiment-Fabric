# A small sentiment-classification benchmark.
#
# The point of putting this in a benchmark rather than in each experiment
# is that "accuracy on sentiment-small" then means one thing. Direction,
# tolerance and the arms everyone compares against are decided here, once,
# and an experiment that disagrees is told so rather than quietly
# reporting a different quantity under the same name.
#
#   fabric benchmarks show sentiment-small
#   fabric run examples/text_classification/experiment.yaml

benchmark:
  name: sentiment-small
  version: v1
  schema_version: "1.0"
  description: >
    Binary sentiment over 1600 short synthetic reviews with deliberate
    negation, generated deterministically from the version string so the
    digests match on any machine. Small enough to run in seconds on a
    laptop, which is the point: it exists to exercise an evaluation
    protocol, not to rank language models.
  license: CC0-1.0
  citation: >
    Generated by examples/text_classification/make_data.py in this
    repository. Not a published benchmark; do not cite it as one.

tasks:
  - name: polarity
    description: Predict the binary sentiment label of a held-out review.
    dataset: sentiment
    metrics: [accuracy, f1]

datasets:
  - name: sentiment
    version: v1
    path: examples/text_classification/data/sentiment-v1
    split: test
    n_examples: 1600
    source: examples/text_classification/make_data.py
    license: CC0-1.0

metrics:
  - name: accuracy
    direction: maximize
    aggregation: mean
    primary: true
    tolerance: 0.01
    description: >
      Fraction of the 400 held-out reviews labelled correctly. The
      tolerance is the margin inside which two results count as
      reproducing each other, not a target.
  - name: f1
    direction: maximize
    aggregation: mean
    tolerance: 0.01
    description: Harmonic mean of precision and recall on the positive class.
  - name: train_seconds
    direction: minimize
    aggregation: mean
    unit: s
    tolerance: 0.5
    required: false
    pinned: false
    description: >
      Wall time to fit. Reported, never part of a claim: it is a property
      of the machine as much as of the method, which is why it is neither
      required nor pinned.

# What a conforming run must return. The runner checks the metrics it was
# asked for; this records the contract for a reader of the definition.
output_schema:
  accuracy: float
  f1: float

baselines:
  - name: majority-class
    description: >
      Always predict the most common training label. The floor: a method
      that does not clear this has not done anything.
    algorithm:
      name: majority-class
      entrypoint: python:examples.text_classification.model:majority
      commit: auto

constraints:
  - kind: min_seeds
    value: 5
    reason: >
      Below five replications the seed variance estimate is too unstable
      for an accuracy difference of the size this task produces to mean
      anything.
  - kind: require_baselines
    value: true
    reason: >
      An accuracy number on this task is uninterpretable without the
      majority-class floor beside it.
  - kind: require_dataset_digest
    value: true
    reason: >
      The generator is deterministic, so there is no excuse for an
      unidentified copy of the data.
