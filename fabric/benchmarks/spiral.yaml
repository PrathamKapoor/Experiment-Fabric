# Two interleaved spirals: a non-linearly-separable classification task.
#
# The one benchmark here whose reference implementation trains a real
# network with real autograd. Deliberately tiny, so the interesting
# question is not "how good is the model" but "how much of the reported
# gain survives a change of seed, environment or data version".
#
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   fabric benchmarks show spiral
#   fabric run examples/torch_mlp/experiment.yaml

benchmark:
  name: spiral
  version: v1
  schema_version: "1.0"
  description: >
    1400 points on two interleaved spirals with Gaussian jitter, split
    1050/350. A linear model cannot solve it and a small MLP can, which
    makes the baseline gap large and unambiguous while the component
    effects stay near the noise floor -- the two regimes an analysis has
    to handle differently.
  license: CC0-1.0
  citation: >
    Generated by examples/torch_mlp/make_data.py in this repository.
    The spiral task is folklore; this instance is not a published dataset.

tasks:
  - name: spiral-classification
    description: Predict which spiral a held-out point belongs to.
    dataset: spiral
    metrics: [accuracy]

datasets:
  - name: spiral
    version: v1
    path: examples/torch_mlp/data/spiral-v1
    split: test
    n_examples: 1400
    source: examples/torch_mlp/make_data.py
    license: CC0-1.0

metrics:
  - name: accuracy
    direction: maximize
    aggregation: mean
    primary: true
    tolerance: 0.01
    description: >
      Fraction of the 350 held-out points classified correctly. The
      tolerance is the margin inside which two results count as
      reproducing each other, not a target.
  - name: f1
    direction: maximize
    aggregation: mean
    tolerance: 0.01
  - name: test_loss
    direction: minimize
    aggregation: mean
    tolerance: 0.02
    description: >
      The sensitive one. It moves under perturbations that leave accuracy
      untouched, because accuracy discards everything but the argmax --
      which is why a reproducibility study on this task must report both.
  - name: train_loss
    direction: minimize
    aggregation: mean
    tolerance: 0.05
    required: false
    description: >
      Diagnostic only. A method that reaches a lower training loss has not
      thereby done better on the task.
  - name: train_seconds
    direction: minimize
    aggregation: mean
    unit: s
    tolerance: 2.0
    required: false
    pinned: false
    description: Wall time to train. Reported, never part of a claim.

output_schema:
  accuracy: float
  f1: float
  test_loss: float

baselines:
  - name: logistic-regression
    description: >
      A linear model, which cannot separate two interleaved spirals. The
      gap to it is the one claim on this task that is not marginal.
    algorithm:
      name: torch-logreg
      entrypoint: python:examples.torch_mlp.model:logistic_regression
      commit: auto

constraints:
  - kind: min_seeds
    value: 10
    reason: >
      Stochastic training on 1050 points puts the seed-to-seed spread
      close to the size of every component effect on this task.
  - kind: require_baselines
    value: [logistic-regression]
  - kind: require_dataset_digest
    value: true
  - kind: max_alpha
    value: 0.05
