# A retrieval-agent question-answering benchmark.
#
# This one is a SIMULATION. The pipeline behind it computes a score from a
# statistical model of an agent rather than by running one, and the
# benchmark says so here rather than letting a reader discover it from the
# source. It exists to exercise ablation, interaction analysis and all six
# perturbation axes in seconds; no result on it is evidence about any real
# agent.
#
#   fabric benchmarks show agent-qa
#   fabric run examples/agent_pipeline/experiment.yaml

benchmark:
  name: agent-qa
  version: v1
  schema_version: "1.0"
  description: >
    400 synthetic questions with a difficulty distribution, answered by a
    simulated five-component retrieval agent. SIMULATED: scores come from
    a model of an agent, not from one. Use it to test experimental
    machinery, never to draw conclusions about agents.
  license: CC0-1.0
  citation: >
    Generated by examples/agent_pipeline/make_data.py in this repository.
    Not a published benchmark.

tasks:
  - name: open-qa
    description: Answer a question given the retrievable corpus.
    dataset: agent-benchmark
    metrics: [accuracy, f1, abstention_rate]
  - name: shifted-qa
    description: >
      The same questions under a distribution shift toward harder ones,
      which is what the robustness metric measures.
    dataset: agent-benchmark
    metrics: [robustness]

datasets:
  - name: agent-benchmark
    version: v1
    path: examples/agent_pipeline/data/benchmark-v1
    split: test
    n_examples: 400
    source: examples/agent_pipeline/make_data.py
    license: CC0-1.0

metrics:
  - name: accuracy
    direction: maximize
    aggregation: mean
    primary: true
    tolerance: 0.01
    description: Fraction of the 400 questions answered correctly.
  - name: f1
    direction: maximize
    aggregation: mean
    tolerance: 0.01
  - name: robustness
    direction: maximize
    aggregation: mean
    tolerance: 0.015
    description: Accuracy under a distribution shift toward harder questions.
  - name: abstention_rate
    direction: minimize
    aggregation: mean
    required: false
    description: >
      Fraction of questions the agent declined. Not required, because a
      method may legitimately never abstain.
  - name: latency_ms
    direction: minimize
    aggregation: mean
    unit: ms
    tolerance: 5.0
    required: false
    pinned: false
    description: >
      Simulated per-question latency. Not pinned: a real implementation
      measuring wall time is reporting something different, and should be
      free to declare its own tolerance.

output_schema:
  accuracy: float
  f1: float
  robustness: float

baselines:
  - name: zero-shot
    description: The model alone, no scaffolding. The floor for this task.
    algorithm:
      name: zero-shot
      entrypoint: python:examples.agent_pipeline.pipeline:zero_shot
      commit: auto

constraints:
  - kind: min_seeds
    value: 10
    reason: >
      Component effects on this task are of the same order as the seed
      noise, so an ablation matrix built on fewer than ten replications
      cannot separate them.
  - kind: require_baselines
    value: [zero-shot]
    reason: >
      A scaffolding result means nothing without the unscaffolded model
      beside it.
  - kind: require_dataset_digest
    value: true
  - kind: require_determinism_check
    value: true
    reason: >
      The pipeline draws randomness at five points. An experiment that has
      not checked whether identical runs agree cannot say which of its
      differences are real.
